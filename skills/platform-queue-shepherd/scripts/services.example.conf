# Service manifest for queue-shepherd. One service per line:
#
#   <service>   <cluster>:<launcher>:<nodes_needed>  [ ...more alternatives... ]
#
# Alternatives are tried in the order written, so the FIRST is the preferred placement.
# `nodes_needed` is WHOLE EMPTY NODES on that cluster, because that is what seats a
# whole-node job. Blank lines and `#` comments are ignored.
#
# THE NUMBER OF ALTERNATIVES IS THE POLICY, and it is the whole reason this is a file rather
# than a flag:
#
#   two or more  ->  migratable. The shepherd may move it when the first is stuck and a
#                    later one has measured room.
#   exactly one  ->  pinned. Watch-and-report only. This is how you encode "its dependencies
#                    exist on one platform only": a venv compiled for one accelerator, a
#                    sidecar built against one driver, a dataset staged on one filesystem.
#                    Writing a second alternative it cannot actually run is worse than
#                    writing none, because the shepherd will strand it there at 3am.
#   absent       ->  refused. `submit` exits rather than guessing a placement.
#
# A service is a ROLE, not a job id. The shepherd keeps one live claim per role, so the name
# should describe what the thing does for you, not which run it happens to be.

# ---- migratable: the same pool builds and runs on either cluster ----
# judge_pool        fast:serve_judge_fast:2      big:serve_judge_big:4

# ---- pinned: one alternative, so it is never moved ----
# indexer_bench     fast:bench_indexer:1

# ---- a three-way service, preferring the cheapest placement that can seat it ----
# embed_pool        cheap:serve_embed_small:1    fast:serve_embed:2     big:serve_embed_big:4
